name: Claude Build

# Builder for Small tickets labeled builder-claude.
# Which workflow runs:
# - pull_request opened, synchronize, reopened, or ready_for_review (not draft):
#   only .github/workflows/claude-review.yml job review (name claude-review).
#   This file does not listen to pull_request.
# - issue_comment created, or pull_request_review_comment created, when the
#   comment contains @claude and the author is OWNER, MEMBER, or COLLABORATOR:
#   only this job (name claude-build). claude-review.yml does not listen to
#   those events. The mention job (name claude-mention) is removed, so one
#   mention starts one Claude job. claude-build opens the pull request.
# - pull_request_review submitted when the review body contains @claude:
#   only claude-build.
# - issues opened when the issue body contains @claude: only claude-build.
# No schedule, label, or assignee trigger. No step merges, approves, pushes
# to main, or enables auto-merge. No time-of-day guard.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  build:
    name: claude-build
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: claude-build-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            mvp/server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install MVP server
        run: npm ci --prefix mvp/server

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Kite dependencies
        run: bun install --frozen-lockfile --cwd apps/kite

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Issue #219 ran in tag mode. That mode's prompt says to post a
          # compare link, so Claude did not run gh pr create. track_progress
          # keeps tag mode when prompt is set: the action still creates the
          # branch and commits as claude[bot] with its app token. A prompt
          # without this switches an issue to agent mode, which does not
          # create that branch. Do not pass a token input or a PAT.
          # Follow-up commits (NEWS-193): Claude runs git add, git commit, and
          # git push on its own branch, with Edit and Write allowed, so the
          # push uses that same app token. The action's own commit path on a
          # later push was github-actions[bot] (PR #230), which held CI and
          # failed claude-review. Pushes to main and force pushes stay
          # disallowed. gh pr edit is this pull request's title and body only.
          track_progress: true
          prompt: |
            The steps above that say to post a "Create a PR" compare link are wrong for this repo.
            After git-push.sh succeeds, open the pull request yourself. Run `gh pr create`.
            Do not post a compare link. Do not ask a person to open the pull request.
            Do not pass a personal access token. The action app token is already the credential.
            The pull request author stays claude[bot].
            Follow-up commits on this branch: run `git add`, `git commit`, and `git push` yourself.
            Never push main. Never force-push.
            `gh pr edit` may change only this pull request's title and body.
            Never merge, approve, or enable auto-merge.
          # real Small tickets (about 3 TDD tasks plus docs) need more than 30 turns; 30 only fit one-line smoke tests.
          claude_args: |
            --max-turns 100
            --append-system-prompt "open a PR, never merge, follow CLAUDE.md and the work-hours hold. After git-push.sh succeeds, Run `gh pr create`. Do not post a compare link. The author stays claude[bot]. Do not pass a personal access token. Follow-up commits on this branch use git add, git commit, and git push. Never push main and never force-push. gh pr edit may change only this pull request title and body."
            --allowedTools "Read,Glob,Grep,Bash(npm test),Bash(npm test:*),Bash(node --test),Bash(node --test:*),Bash(npm run typecheck),Bash(npm run typecheck:*),Bash(npm run test:kite),Bash(npm run test:kite:*),Bash(bun run --cwd apps/kite lint),Bash(bun run --cwd apps/kite lint:*),Bash(bun run --cwd apps/kite check),Bash(bun run --cwd apps/kite check:*),Bash(bun run --cwd apps/kite test:unit),Bash(bun run --cwd apps/kite test:unit:*),Bash(bun run --cwd apps/kite build),Bash(bun run --cwd apps/kite build:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Edit,Write,Bash(git add),Bash(git add:*),Bash(git commit),Bash(git commit:*),Bash(git push),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr edit),Bash(gh pr edit:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(git push origin main),Bash(git push origin main:*),Bash(git push -u origin main),Bash(git push -u origin main:*),Bash(git push origin HEAD:main),Bash(git push origin HEAD:main:*),Bash(git push --force),Bash(git push --force:*),Bash(git push -f),Bash(git push -f:*),Bash(git push --force-with-lease),Bash(git push --force-with-lease:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh issue create:*),Bash(npm install),Bash(npm install:*),Bash(npm ci),Bash(npm ci:*),Bash(bun install),Bash(bun install:*),Bash(npx:*),Bash(curl:*),Bash(wget:*)"
