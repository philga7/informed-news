name: Claude Build

# Builder for Small tickets labeled builder-claude.
# Which workflow runs:
# - pull_request opened, synchronize, reopened, or ready_for_review (not draft):
#   only .github/workflows/claude-review.yml job review (name claude-review).
#   This file does not listen to pull_request.
# - issue_comment created, or pull_request_review_comment created, when the
#   comment contains @claude and the author is OWNER, MEMBER, or COLLABORATOR:
#   only this job (name claude-build). claude-review.yml does not listen to
#   those events. The mention job (name claude-mention) is removed, so one
#   mention starts one Claude job. claude-build opens the pull request.
# - pull_request_review submitted when the review body contains @claude:
#   only claude-build.
# - issues opened when the issue body contains @claude: only claude-build.
# No schedule, label, or assignee trigger. No step merges, approves, pushes
# to main, or enables auto-merge. No time-of-day guard.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  build:
    name: claude-build
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    concurrency:
      group: claude-build-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install Kite dependencies
        run: bun install --frozen-lockfile --cwd apps/kite

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 30
            --append-system-prompt "open a PR, never merge, follow CLAUDE.md and the work-hours hold."
            --allowedTools "Read,Glob,Grep,Bash(npm test),Bash(npm test:*),Bash(npm run typecheck),Bash(npm run typecheck:*),Bash(npm run test:kite),Bash(npm run test:kite:*),Bash(npm ci),Bash(npm ci:*),Bash(bun run --cwd apps/kite lint),Bash(bun run --cwd apps/kite lint:*),Bash(bun run --cwd apps/kite check),Bash(bun run --cwd apps/kite check:*),Bash(bun run --cwd apps/kite test:unit),Bash(bun run --cwd apps/kite test:unit:*),Bash(bun run --cwd apps/kite build),Bash(bun run --cwd apps/kite build:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr checks:*),Bash(gh pr diff:*),Bash(gh issue comment:*),Bash(gh issue view:*),Bash(gh run view:*),Bash(gh run list:*)"
            --disallowedTools "Bash(git push origin main),Bash(git push origin main:*),Bash(git push -u origin main),Bash(git push -u origin main:*),Bash(git push origin HEAD:main),Bash(git push origin HEAD:main:*),Bash(git push --force),Bash(git push --force:*),Bash(git push -f),Bash(git push -f:*),Bash(git push --force-with-lease),Bash(git push --force-with-lease:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh issue create:*),Bash(npm install),Bash(npm install:*),Bash(bun install),Bash(bun install:*),Bash(npx:*),Bash(curl:*),Bash(wget:*)"
