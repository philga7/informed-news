name: Release

on:
  push:
    branches:
      - main

jobs:
  validate:
    name: Pre-Release Validation
    permissions:
      contents: read
    uses: ./.github/workflows/pre-release-validate.yml

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # The "main requires CI" ruleset rejects direct pushes to main.
      # The release deploy key is the bypass for this push, so the release
      # commit and tag go out over SSH.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
