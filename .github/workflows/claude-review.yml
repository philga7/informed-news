name: Claude Review
# Automatic review on pull_request is this file's review job only.
# An @claude mention does not start a job here. .github/workflows/claude.yml
# job build (name claude-build) owns every @claude mention. The mention job
# (name claude-mention) is removed, so one mention starts one Claude job.
# claude-build opens a pull request for Claude-eligible work.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# contents: read and pull-requests: write are the job's GitHub token permissions.
# pull-requests: write is for comments only. Issue writes are not granted.
# id-token: write stays because the action's default GitHub App token path
# requires it (action docs and docs/setup.md), not only workload-identity
# federation. contents stays read, so a push with the job token cannot land.
# The action's OIDC app token defaults to contents, pull requests, and issues
# write unless additional_permissions overrides those keys (token.ts merges
# the override on top of that default). The review step sets that override.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    name: claude-review
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Action docs: comma-separated bot usernames, e.g. dependabot[bot].
          # Only this automatic review job. cursor[bot] reviews Cursor agent
          # PRs. claude[bot] reviews pull requests the builder opens, so the
          # approval rule has a review to read. github-actions[bot] is the
          # actor on a Claude Build follow-up push (PR #257, run 42748052627);
          # without it the review fails as a non-human actor. Never "*".
          # @claude mentions are not a trigger on this workflow, so they stay
          # limited to humans on claude-build.
          allowed_bots: "cursor[bot],claude[bot],github-actions[bot]"
          # Overrides the action's app-token defaults (contents, pull_requests,
          # and issues write). Underscore keys match the GitHub token API.
          # issues: read is so `gh issue view` can read the linked issue body.
          additional_permissions: |
            contents: read
            pull_requests: write
            issues: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This is an automatic pull request review. You have no Jira access.
            Read the acceptance criteria in this pull request's body and in the
            linked GitHub issue body (`gh pr view` and `gh issue view`). Review
            the diff against those acceptance criteria only. If neither body
            states acceptance criteria, say so in the summary comment and do
            not invent criteria.

            Post findings as pull request comments only: a summary with
            `gh pr comment`, and inline comments for specific lines.

            Do not edit files. Do not commit. Do not push. Do not approve.
            Do not merge. Do not run `gh pr review`, `gh pr merge`, `gh pr edit`,
            or `git push`.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git add),Bash(git add:*),Bash(git commit),Bash(git commit:*),Bash(git push),Bash(git push:*),Bash(gh pr merge:*),Bash(gh pr review:*),Bash(gh pr edit),Bash(gh pr edit:*),Bash(gh issue comment:*),Bash(gh issue create:*)"
