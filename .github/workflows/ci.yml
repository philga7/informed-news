name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: MVP build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install MVP packages
        run: |
          npm ci --prefix mvp/server
          npm ci --prefix mvp/web

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Kite provenance tests
        run: npm run test:kite

      - name: Build web
        run: npm run build

      # Optional heavier path: install kite + Playwright when apps/kite changes.
      # Full e2e remains local via `npm run test:e2e:kite` until NEWS-41 wires default dev.