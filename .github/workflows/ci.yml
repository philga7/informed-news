name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: MVP build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install MVP packages
        run: |
          npm ci --prefix mvp/server
          npm ci --prefix mvp/web

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm run build
