name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    name: MVP build & typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-dummy
          POSTGRES_USER: informed_news
          POSTGRES_DB: informed_news_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U informed_news -d informed_news_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INFORMED_NEWS_TEST_DATABASE_URL: postgres://informed_news:ci-dummy@127.0.0.1:5432/informed_news_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install root dependencies
        run: npm ci

      - name: Install MVP server
        run: npm ci --prefix mvp/server

      - name: Install Kite
        run: bun install --frozen-lockfile --cwd apps/kite

      - name: Install shell
        run: bun install --frozen-lockfile --cwd apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Shell check
        working-directory: apps/web
        run: bun run check

      - name: Build shell
        working-directory: apps/web
        run: bun run build

      - name: Shell unit tests
        working-directory: apps/web
        run: bun run test:unit

      - name: Test shell build
        run: npm run test:shell-build --prefix mvp/server

      - name: Test
        run: npm test

      - name: Kite provenance tests
        run: npm run test:kite

      - name: Kite unit tests
        working-directory: apps/kite
        run: bun run test:unit

      - name: Kite check
        working-directory: apps/kite
        run: bun run check

      - name: Product-path build (Kite)
        working-directory: apps/kite
        run: bun run build

      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          start=$(date +%s)
          docker build -t informed-news:ci .
          end=$(date +%s)
          echo "image_build_seconds=$((end - start))" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure and start container
        shell: bash
        run: |
          set -euo pipefail
          docker network create nanobot-mem0
          docker network create informed-news-db
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker compose logs || true; fi; docker compose down || true' EXIT
          env_file="$RUNNER_TEMP/informed-news-ci.env"
          (umask 077; cat > "$env_file" <<'EOF'
          MVP_PASSWORD=ci-dummy
          SESSION_SECRET=ci-dummy-secret
          POSTGRES_PASSWORD=ci-dummy
          POSTGRES_USER=informed_news
          POSTGRES_DB=informed_news
          INFORMED_NEWS_INSTANCE=live
          REFRESH_INTERVAL_HOURS=off
          TOPIC_SEARCH_ENABLED=true
          SEARXNG_URL=http://searxng:8080
          EOF
          )
          postgres_env_file="$RUNNER_TEMP/informed-news-ci-postgres.env"
          (umask 077; cat > "$postgres_env_file" <<'EOF'
          POSTGRES_PASSWORD=ci-dummy
          POSTGRES_USER=informed_news
          POSTGRES_DB=informed_news
          EOF
          )
          export INFORMED_NEWS_ENV_FILE="$env_file"
          export INFORMED_NEWS_POSTGRES_ENV_FILE="$postgres_env_file"
          export COMPOSE_PROFILES=informed-news-postgres
          export INFORMED_NEWS_IMAGE=informed-news:ci
          rendered=$(docker compose config)
          echo "$rendered" | grep -q 'http://searxng:8080'
          echo "$rendered" | grep -q 'TOPIC_SEARCH_ENABLED'
          start=$(date +%s)
          if ! docker compose up -d --wait --no-build; then
            docker compose logs
            docker compose down
            exit 1
          fi
          end=$(date +%s)
          echo "container_start_seconds=$((end - start))" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS http://127.0.0.1:3001/healthz
          shell_html=$(curl -fsS http://127.0.0.1:3001/shell)
          printf '%s' "$shell_html" | grep -F -q '<h1>Informed News</h1>'

      # Playwright e2e stays local (`npm run test:e2e:kite`) until the hermetic
      # stack fits the Actions time budget (see NEWS-105).
