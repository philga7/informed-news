# Included only when the Compose project name is informed-news.
services:
  postgres:
    profiles:
      - ${COMPOSE_PROJECT_NAME:-informed-news}-postgres
    image: postgres:16-alpine
    env_file:
      - ${INFORMED_NEWS_POSTGRES_ENV_FILE:-/opt/informed-news/postgres.env}
    environment:
      POSTGRES_USER: informed_news
    command: ["postgres", "-c", "shared_buffers=128MB"]
    mem_limit: 512m
    shm_size: 256mb
    volumes:
      - informed-news-postgres:/var/lib/postgresql/data
    networks:
      - informed-news-db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U informed_news",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  informed-news-postgres:
    # Unset on project informed-news stays informed-news-postgres.
    name: ${INFORMED_NEWS_POSTGRES_VOLUME:-${COMPOSE_PROJECT_NAME:-informed-news}-postgres}
